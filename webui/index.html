<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pywal web</title>
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="panel">
        <div class="panel__title">pywal</div>

        <div class="group">
          <div class="label">Image</div>
          <div class="row">
            <button id="use-wallpaper" class="btn">Use current wallpaper</button>
            <button id="regen" class="btn btn--primary">Generate</button>
          </div>
          <input id="file" class="file" type="file" accept="image/*" />
          <div id="image-path" class="muted"></div>
        </div>

        <div class="group">
          <div class="label">Theme</div>
          <div class="row">
            <label class="check"><input id="light" type="checkbox" /> Light</label>
            <label class="check"><input id="shuffle" type="checkbox" /> Shuffle</label>
          </div>
          <label class="field">
            <span>shading</span>
            <select id="shading">
              <option value="lighten" selected>lighten</option>
              <option value="darken">darken</option>
            </select>
          </label>
        </div>

        <div class="group">
          <div class="label">Seeding</div>
          <label class="field">
            <span>generation_strategy</span>
            <select id="generation_strategy">
              <option value="subtractive" selected>subtractive</option>
              <option value="iterative">iterative</option>
            </select>
          </label>
          <label class="field">
            <span>subtractive_initial</span>
            <input id="subtractive_initial" type="number" min="8" max="32" step="1" value="16" />
          </label>
          <label class="field">
            <span>seed</span>
            <input id="seed" type="number" min="0" step="1" placeholder="(empty = random)" />
          </label>
        </div>

        <div class="group">
          <div class="label">Ops</div>
          <label class="field">
            <span>contrast</span>
            <input id="contrast" type="range" min="0" max="21" step="0.5" value="2" />
            <span id="contrast-val" class="mono"></span>
          </label>
          <label class="field">
            <span>brightness (%)</span>
            <input id="brightness" type="range" min="0" max="100" step="1" value="0" />
            <span id="brightness-val" class="mono"></span>
          </label>
          <label class="field">
            <span>saturate (delta %)</span>
            <input id="saturate" type="range" min="-100" max="100" step="1" value="0" />
            <span id="saturate-val" class="mono"></span>
          </label>
          <label class="field">
            <span>bg_chroma_floor</span>
            <input id="bg_chroma_floor" type="range" min="0" max="0.10" step="0.005" value="0.03" />
            <span id="bg_chroma_floor-val" class="mono"></span>
          </label>
          <label class="field">
            <span>greyish_chroma_threshold</span>
            <input id="greyish_chroma_threshold" type="range" min="0" max="0.10" step="0.005" value="0.04" />
            <span id="greyish_chroma_threshold-val" class="mono"></span>
          </label>
        </div>

        <div class="group">
          <div class="label">Choose</div>
          <label class="field">
            <span>choose</span>
            <select id="choose">
              <option value="backend" selected>backend</option>
              <option value="brightness">brightness</option>
              <option value="saturation">saturation</option>
              <option value="random">random</option>
            </select>
          </label>
        </div>
      </aside>

      <main class="main">
        <div class="overview">
          <div class="overview__top">
            <div class="preview">
              <img id="preview-img" class="preview__img" alt="preview" />
              <div id="preview-label" class="preview__label"></div>
            </div>
          </div>

          <div class="overview__row">
            <div class="block block--wide">
              <div class="block__title">Main Colors</div>
              <div id="main8" class="strip8"></div>
            </div>
          </div>

          <div class="overview__row">
            <div class="block">
              <div class="block__title">Surfaces</div>
              <div id="surfaces" class="surfacescol"></div>
            </div>
            <div class="block">
              <div class="block__title">Colors</div>
              <div class="colors2col">
                <div id="colors-left" class="colorcol"></div>
                <div id="colors-right" class="colorcol"></div>
                <div id="colors-bottom" class="colorbottom"></div>
              </div>
            </div>
          </div>

          <div class="overview__row">
            <div class="block block--wide">
              <div id="sample" class="sample">
                <div class="sample__title">Sample</div>
                <div class="sample__text">bg/fg</div>
                <div class="sample__text">The quick brown fox jumps over the lazy dog.</div>
              </div>
            </div>
          </div>
        </div>

        <div class="section">
          <div class="section__title">Debug</div>
          <pre id="debug" class="debug"></pre>
        </div>
      </main>
    </div>
    <script src="/assets/app.js"></script>
  </body>
</html>
