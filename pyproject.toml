[project]
name = "pywal"
version = "0.3.1"
description = "pywal fork with ANSI-matched OKLCH palettes, a semantic palette contract and Palette Studio"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "modern-colorthief>=0.1.7",
    "pillow>=11.3",
]

[project.scripts]
wal = "pywal.__main__:main"
walstudio = "pywal.studio.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The whole package, data included: templates, colorschemes and Studio's static page.
packages = ["pywal"]
